plugins { id 'com.android.application' }
android {
    namespace 'dev.horizonbridge.legacydriver'
    compileSdk 35
    ndkVersion '26.3.11579264'
    buildFeatures { prefab true }
    defaultConfig {
        // This is a loader lookup key from the received legacy contract, not a
        // Meta identity/entitlement assertion. Install only on the test phone.
        applicationId 'com.oculus.systemdriver'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.15.0-openxr-profiles'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_static', '-DHB_BUILD_LEGACY_VRAPI=ON',
                "-DVRAPI_ROOT=${providers.gradleProperty('vrapiRoot').getOrElse('')}"
        } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49' }
