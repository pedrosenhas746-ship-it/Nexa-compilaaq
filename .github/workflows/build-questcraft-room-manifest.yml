name: Extract Original QuestCraft Lodge

on:
  workflow_dispatch:
  push:
    branches:
      - questcraft-nexa-androidstudio
    paths:
      - 'questcraft_nexa/room_converter/**'
      - '.github/workflows/build-questcraft-room-manifest.yml'

permissions:
  contents: read

env:
  QCXR_ROOM_COMMIT: 'a8d46ea0db48d31015c1794bf5159a7b9c6edb4d'

jobs:
  extract-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: QuestCraftPlusPlus/QCXR-XR-Wrapper
          ref: ${{ env.QCXR_ROOM_COMMIT }}
          path: upstream/qcxr
          fetch-depth: 1

      - name: Install room conversion tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq assimp-utils python3-pil
          assimp version

      - name: Build Unity GUID index
        run: |
          set -euo pipefail
          mkdir -p out/room
          python3 questcraft_nexa/room_converter/guid_index.py \
            upstream/qcxr/Assets \
            out/room/guid-index.json

      - name: Extract Main.unity room manifest
        run: |
          set -euo pipefail
          python3 questcraft_nexa/room_converter/unity_scene_manifest.py \
            upstream/qcxr/Assets/Scenes/Main.unity \
            out/room/guid-index.json \
            out/room/main-scene.json \
            --report out/room/report.txt

      - name: Generate Android-native room spec
        run: |
          set -euo pipefail
          python3 questcraft_nexa/room_converter/build_native_room_spec.py \
            out/room/main-scene.json \
            upstream/qcxr \
            out/room/nexa-room.json

      - name: Convert original lodge models to GLB
        run: |
          set -euo pipefail
          mkdir -p out/room/lodge_models
          python3 questcraft_nexa/room_converter/convert_lodge_models.py \
            out/room/nexa-room.json \
            upstream/qcxr \
            out/room/lodge_models

      - name: Extract original MainMenu Canvas
        run: |
          set -euo pipefail
          python3 questcraft_nexa/room_converter/extract_main_menu_ui.py \
            upstream/qcxr/Assets/Scenes/Main.unity \
            out/room/guid-index.json \
            out/room/nexa-mainmenu.json
          python3 - <<'PY'
          import json, pathlib
          p=json.load(open('out/room/nexa-mainmenu.json'))
          assert p['format'] == 'nexa-questcraft-mainmenu-ui-v1'
          names={o['name'] for o in p['objects']}
          required={'MainCanvas','MainPanel','Bottom Bar','Play Button','InstanceManagerButton','ModSearchButton'}
          assert not (required-names), sorted(required-names)
          refs=p.get('asset_refs',[])
          report=[]
          for r in refs:
              rel=r.get('path')
              if not rel:
                  continue
              src=pathlib.Path('upstream/qcxr')/rel
              report.append({
                  'path': rel,
                  'exists': src.exists(),
                  'bytes': src.stat().st_size if src.is_file() else None,
                  'suffix': src.suffix.lower() if src.exists() else None,
                  'guid': r.get('guid'),
                  'file_id': r.get('file_id'),
              })
          pathlib.Path('out/room/ui-assets-report.json').write_text(
              json.dumps(report,indent=2), encoding='utf-8')

          # Preserve the exact public QCXR UI source assets for the native converter.
          # Keeping .meta files lets us recover Unity sprite/font import metadata too.
          import shutil
          ui_root=pathlib.Path('out/room/ui_assets')
          copied=0
          for r in refs:
              rel=r.get('path')
              if not rel or rel.startswith('<'):
                  continue
              src=pathlib.Path('upstream/qcxr')/rel
              if not src.is_file():
                  continue
              dst=ui_root/pathlib.Path(rel).relative_to('Assets')
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src,dst)
              copied+=1
              meta=src.with_name(src.name+'.meta')
              if meta.is_file():
                  shutil.copy2(meta,dst.with_name(dst.name+'.meta'))
          print('Copied original UI source assets:', copied)
          print('Original MainMenu objects:', p['object_count'])
          print('Original MainMenu canvas:', p.get('canvas_size'))
          print('Referenced UI assets:', len(refs))
          for x in report:
              print(('OK  ' if x['exists'] else 'MISS') + ' ' + x['path'])
          PY

      - name: Extract exact TextMesh Pro SDF atlases
        run: |
          set -euo pipefail
          mkdir -p out/room/tmp_fonts
          python3 questcraft_nexa/room_converter/extract_tmp_sdf.py \
            'upstream/qcxr/Assets/Resources/UI/Sunflower-Bold SDF.asset' \
            out/room/tmp_fonts --name sunflower-bold
          python3 questcraft_nexa/room_converter/extract_tmp_sdf.py \
            'upstream/qcxr/Assets/Resources/UI/Perfect DOS VGA 437 Win SDF.asset' \
            out/room/tmp_fonts --name perfect-dos
          python3 questcraft_nexa/room_converter/extract_tmp_sdf.py \
            'upstream/qcxr/Assets/TextMesh Pro/Resources/Fonts & Materials/LiberationSans SDF.asset' \
            out/room/tmp_fonts --name liberation-sans
          test -s out/room/tmp_fonts/sunflower-bold.png
          test -s out/room/tmp_fonts/sunflower-bold.json
          test -s out/room/tmp_fonts/perfect-dos.png
          test -s out/room/tmp_fonts/liberation-sans.png

      - name: Verify original launcher anchors and hierarchy
        run: |
          set -euo pipefail
          grep -Fq 'Play Button' out/room/nexa-room.json
          grep -Fq 'Assets/QCWorld/QCWorld.obj' out/room/nexa-room.json
          grep -Fq 'Assets/WinterLodge/Bear/Bear.fbx' out/room/nexa-room.json
          python3 - <<'PY'
          import json, pathlib
          p=json.load(open('out/room/nexa-room.json'))
          assert p['format'] == 'nexa-questcraft-room-v2'
          assert p['source']['commit'] == 'a8d46ea0db48d31015c1794bf5159a7b9c6edb4d'
          assert p['qcworld']['position'] == {'x': -18.58, 'y': -125.09, 'z': 1.0}
          assert p['qcworld']['parent_instance_id'] is None
          assert len(p['props']) == 7
          assert len(p['qcworld_materials']) == 128
          assert len(p.get('runtime_models', [])) == 8
          assert any(o['name']=='Play Button' for o in p['main_menu'])
          assert p['asset_policy']['qcworld_glb_contains_minecraft_texture_bytes'] is False

          by_source={x['source']['path']: x for x in p['props']}
          qc_id=p['qcworld']['scene_instance_id']
          crt=by_source['Assets/WinterLodge/Reality Display/Crt Body.obj']
          display=by_source['Assets/WinterLodge/Reality Display/Display.obj']
          assert display['parent_instance_id'] == crt['scene_instance_id']
          for src,item in by_source.items():
              if src != 'Assets/WinterLodge/Reality Display/Display.obj':
                  assert item['parent_instance_id'] == qc_id, (src, item['parent_instance_id'], qc_id)

          glbs=list(pathlib.Path('out/room/lodge_models').glob('*.glb'))
          assert len(glbs)==8, len(glbs)
          assert all(x.stat().st_size >= 128 for x in glbs)
          print('Native lodge conversion verified:', len(glbs), 'GLBs, hierarchy OK')
          PY
          cat out/room/report.txt

      - name: Copy source license
        run: |
          set -euo pipefail
          cp upstream/qcxr/LICENSE out/room/QCXR-LICENSE.txt

      - name: Upload converted original room
        uses: actions/upload-artifact@v4
        with:
          name: QuestCraft-Original-Lodge-Native
          path: out/room/**
          if-no-files-found: error
          retention-days: 14
