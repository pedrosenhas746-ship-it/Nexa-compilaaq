name: Extract Original QuestCraft Lodge

on:
  workflow_dispatch:
  push:
    branches:
      - questcraft-nexa-androidstudio
    paths:
      - 'questcraft_nexa/room_converter/**'
      - '.github/workflows/build-questcraft-room-manifest.yml'

permissions:
  contents: read

jobs:
  extract-room:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: QuestCraftPlusPlus/QCXR-XR-Wrapper
          ref: CardboardCraft
          path: upstream/qcxr
          fetch-depth: 1

      - name: Build Unity GUID index
        run: |
          set -euo pipefail
          mkdir -p out/room
          python3 questcraft_nexa/room_converter/guid_index.py \
            upstream/qcxr/Assets \
            out/room/guid-index.json

      - name: Extract Main.unity room manifest
        run: |
          set -euo pipefail
          python3 questcraft_nexa/room_converter/unity_scene_manifest.py \
            upstream/qcxr/Assets/Scenes/Main.unity \
            out/room/guid-index.json \
            out/room/main-scene.json \
            --report out/room/report.txt

      - name: Generate Android-native room spec
        run: |
          set -euo pipefail
          python3 questcraft_nexa/room_converter/build_native_room_spec.py \
            out/room/main-scene.json \
            upstream/qcxr \
            out/room/nexa-room.json

      - name: Verify original launcher anchors
        run: |
          set -euo pipefail
          grep -Fq 'Play Button' out/room/nexa-room.json
          grep -Fq 'Assets/QCWorld/QCWorld.obj' out/room/nexa-room.json
          grep -Fq 'Assets/WinterLodge/Bear/Bear.fbx' out/room/nexa-room.json
          python3 - <<'PY'
          import json
          p=json.load(open('out/room/nexa-room.json'))
          assert p['qcworld']['position'] == {'x': -18.58, 'y': -125.09, 'z': 1.0}
          assert len(p['props']) == 7
          assert len(p['qcworld_materials']) == 128
          assert any(o['name']=='Play Button' for o in p['main_menu'])
          print('Native lodge spec verified:', len(p['main_menu']), 'menu objects,', len(p['qcworld_materials']), 'materials')
          PY
          cat out/room/report.txt

      - name: Upload room manifest
        uses: actions/upload-artifact@v4
        with:
          name: QuestCraft-Original-Lodge-Manifest
          path: out/room/**
          if-no-files-found: error
          retention-days: 14
