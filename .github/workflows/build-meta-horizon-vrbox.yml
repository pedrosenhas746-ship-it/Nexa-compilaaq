name: Build Meta Horizon VRBox patch

on:
  workflow_dispatch:
  push:
    branches: [ meta-horizon-vrbox-build ]
    paths:
      - 'vrbox_patch/**'
      - '.github/workflows/build-meta-horizon-vrbox.yml'

permissions:
  contents: read

env:
  META_VERSION: '389.1.0.22.220'
  META_VERSION_CODE: '1074763581'
  APKTOOL_VERSION: '3.0.3'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -mindepth 2 -maxdepth 2 -name android.jar | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/d8"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          test -f "$ANDROID_JAR"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$ANDROID_JAR" >> "$GITHUB_ENV"

      - name: Download exact Meta Horizon APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36' \
            "https://d.apkpure.com/b/APK/com.oculus.twilight?versionCode=${META_VERSION_CODE}" \
            -o base.apk
          test -s base.apk
          test "$(stat -c%s base.apk)" -gt 70000000
          unzip -tq base.apk
          sha256sum base.apk | tee base.apk.sha256
          ls -lh base.apk

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o apktool.jar
          test -s apktool.jar
          java -jar apktool.jar --version

      - name: Decode resources and preserve original DEX
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar apktool.jar d -f --no-src -o decoded base.apk
          test -f decoded/AndroidManifest.xml
          grep -q 'com.oculus.twilight' decoded/AndroidManifest.xml
          mkdir -p decoded/assets

      - name: Inject VRBox startup provider and image
        shell: bash
        run: |
          set -euo pipefail
          base64 -d vrbox_patch/vrbox_headset.webp.b64 > decoded/assets/vrbox_headset.webp
          test -s decoded/assets/vrbox_headset.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('decoded/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          provider = '''        <provider android:name="com.oculus.twilight.vrbox.VrBoxInitProvider" android:authorities="com.oculus.twilight.vrbox.initprovider" android:exported="false" android:initOrder="2147483647" />\n'''
          if 'com.oculus.twilight.vrbox.VrBoxInitProvider' not in s:
              if '</application>' not in s:
                  raise SystemExit('application element not found')
              s = s.replace('</application>', provider + '    </application>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'VrBoxInitProvider' decoded/AndroidManifest.xml

      - name: Compile injected Java to DEX
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inject-classes inject-dex
          mkdir -p inject-classes inject-dex
          javac -source 8 -target 8 -encoding UTF-8 \
            -classpath "$ANDROID_JAR" \
            -d inject-classes \
            vrbox_patch/VrBoxInitProvider.java \
            vrbox_patch/VrBoxPairingOverlay.java
          jar cf inject.jar -C inject-classes .
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_JAR" --output inject-dex inject.jar
          test -s inject-dex/classes.dex
          ls -lh inject-dex/classes.dex

      - name: Rebuild Meta Horizon resources
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx4g -jar apktool.jar b -f decoded -o meta-horizon-vrbox-unsigned.apk
          test -s meta-horizon-vrbox-unsigned.apk
          unzip -tq meta-horizon-vrbox-unsigned.apk

      - name: Add injected DEX as next classesN.dex
        shell: bash
        run: |
          set -euo pipefail
          cp meta-horizon-vrbox-unsigned.apk meta-horizon-vrbox-injected.apk
          NEXT_DEX="$(python3 - <<'PY'
          import re, subprocess
          names = subprocess.check_output(['unzip','-Z1','meta-horizon-vrbox-injected.apk'], text=True).splitlines()
          nums=[]
          for n in names:
              m=re.fullmatch(r'classes(\d*)\.dex', n)
              if m:
                  nums.append(int(m.group(1) or '1'))
          print(max(nums or [0]) + 1)
          PY
          )"
          cp inject-dex/classes.dex "classes${NEXT_DEX}.dex"
          zip -q -j meta-horizon-vrbox-injected.apk "classes${NEXT_DEX}.dex"
          rm -f "classes${NEXT_DEX}.dex"
          zip -d meta-horizon-vrbox-injected.apk 'META-INF/*' >/dev/null 2>&1 || true
          echo "Injected as classes${NEXT_DEX}.dex"
          unzip -Z1 meta-horizon-vrbox-injected.apk | grep -E '^classes[0-9]*\.dex$' | tail

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          "$BUILD_TOOLS/zipalign" -f -p 4 meta-horizon-vrbox-injected.apk meta-horizon-vrbox-aligned.apk
          keytool -genkeypair -noprompt \
            -keystore vrbox-test.keystore -storepass android -keypass android \
            -alias vrbox -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=VRBox Patch, OU=NEXA, O=Local Build, L=Local, ST=NA, C=BR'
          "$BUILD_TOOLS/apksigner" sign \
            --ks vrbox-test.keystore --ks-pass pass:android --key-pass pass:android \
            --out Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk \
            meta-horizon-vrbox-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk
          unzip -tq Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk
          sha256sum Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk | tee Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk.sha256
          ls -lh Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meta-Horizon-389-VRBox-MOD
          path: |
            Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk
            Meta_Horizon_389.1.0.22.220_VRBox_MOD.apk.sha256
          if-no-files-found: error
          retention-days: 7
