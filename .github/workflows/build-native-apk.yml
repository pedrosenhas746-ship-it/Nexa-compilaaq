name: NEXA Universal Runtime v2 APK

on:
  push:
    branches: [ universal-runtime-v2 ]
    paths:
      - 'native/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify universal runtime source
        shell: bash
        run: |
          set -euo pipefail
          grep -Rqs 'QuestCompatibilityScanner' native/app/src/main/java
          grep -Rqs 'UniversalRuntimeManager' native/app/src/main/java
          grep -Rqs 'libopenxr_loader' native/app/src/main/java
          grep -Rqs 'libovrplugin' native/app/src/main/java
          grep -Rqs 'libvrapi' native/app/src/main/java

      - name: Build debug APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='native/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/NEXA-Universal-Runtime-v2-debug.apk
          sha256sum out/NEXA-Universal-Runtime-v2-debug.apk | tee out/NEXA-Universal-Runtime-v2-debug.apk.sha256
          ls -lh out/NEXA-Universal-Runtime-v2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-Universal-Runtime-v2-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
