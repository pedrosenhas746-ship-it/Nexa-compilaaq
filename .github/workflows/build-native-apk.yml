name: Quest Exporter APK

on:
  push:
    branches: [ quest-exporter-build ]
    paths:
      - '.github/workflows/build-native-apk.yml'
      - 'quest-exporter-source.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate Quest Exporter source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d quest-exporter-source.b64 > /tmp/quest-exporter.zip
          echo "c8dc1bf5e3601ad669eb32133ec6c12c6d3f00933de32b9b0366264e99efaa4c  /tmp/quest-exporter.zip" | sha256sum -c -
          unzip -q /tmp/quest-exporter.zip
          test -f quest_exporter/app/src/main/java/com/horizon/questexporter/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: quest_exporter
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          APK='quest_exporter/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/Quest-Exporter-1.0-debug.apk
          sha256sum out/Quest-Exporter-1.0-debug.apk | tee out/Quest-Exporter-1.0-debug.apk.sha256
          ls -lh out/Quest-Exporter-1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quest-Exporter-1.0-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
