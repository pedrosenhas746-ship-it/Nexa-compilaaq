name: NEXA Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify clean source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'superhot' native; then
            echo 'Forbidden SUPERHOT reference found'
            exit 2
          fi
          grep -Rqs 'com.minevr.bridge' native/app/src/main
          grep -Rqs 'com.roblox.client' native/app/src/main

      - name: Build debug APK
        working-directory: native
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='native/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/NEXA-XR-OS-23-native-debug.apk
          sha256sum out/NEXA-XR-OS-23-native-debug.apk | tee out/NEXA-XR-OS-23-native-debug.apk.sha256
          ls -lh out/NEXA-XR-OS-23-native-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-XR-OS-23-native-APK
          path: out/*
          if-no-files-found: error
          retention-days: 14
