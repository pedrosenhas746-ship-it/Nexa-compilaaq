name: Unity Secret Probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/unity-secret-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Unity secret availability
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
        run: |
          echo "UNITY_LICENSE_PRESENT=$HAS_LICENSE"
          echo "UNITY_EMAIL_PRESENT=$HAS_EMAIL"
          echo "UNITY_PASSWORD_PRESENT=$HAS_PASSWORD"
          echo "UNITY_SERIAL_PRESENT=$HAS_SERIAL"
