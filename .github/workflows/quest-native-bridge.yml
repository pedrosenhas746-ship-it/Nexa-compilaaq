name: NEXA Quest native compatibility
on:
  push:
    branches: [quest-native-bridge-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - name: Retrieve pinned SDK declarations (not Meta binaries)
        run: |
          curl --fail --location --retry 3 -o /tmp/vrapi-sdk.zip https://raw.githubusercontent.com/emawind84/ovr_sdk_mobile_dist/edaf95714e80dcd2645f69ef255d6fbfc883a73e/ovr_sdk_mobile_1.50.0.zip
          python3 quest-compat/tools/extract-sdk-headers.py /tmp/vrapi-sdk.zip /tmp/vrapi-sdk
      - name: Host tests
        run: python3 -m unittest discover -s quest-compat/tests -v
      - name: ELF and Unity settings host regressions
        run: |
          curl --fail --location --retry 3 -o /tmp/lz4-java.jar https://repo.maven.apache.org/maven2/org/lz4/lz4-java/1.8.0/lz4-java-1.8.0.jar
          echo 'd74a3334fb35195009b338a951f918203d6bbca3d1d359033dc33edd1cadc9ef  /tmp/lz4-java.jar' | sha256sum -c -
          mkdir -p /tmp/compat-tests
          javac -cp /tmp/lz4-java.jar -d /tmp/compat-tests native/app/src/main/java/com/nexa/xr/importer/ElfSymbols.java native/app/src/main/java/com/nexa/xr/importer/UnityOpenXrProfiles.java quest-compat/tests/java/ElfAuditTest.java quest-compat/tests/java/UnityProfilesTest.java native/app/src/main/java/com/nexa/xr/input/ControllerPacket.java quest-compat/tests/java/ControllerPacketTest.java
          java -cp /tmp/compat-tests:/tmp/lz4-java.jar ControllerPacketTest
          java -cp /tmp/compat-tests:/tmp/lz4-java.jar ElfAuditTest
          java -cp /tmp/compat-tests:/tmp/lz4-java.jar com.nexa.xr.importer.UnityProfilesTest
      - name: Build own VrApi library and driver
        working-directory: quest-compat/android
        run: gradle --no-daemon --stacktrace :legacy-driver:assembleDebug -PvrapiRoot=/tmp/vrapi-sdk/VrApi
      - name: Bundle own runtime libraries for on-device importing
        run: |
          python3 - <<'PYCODE'
          import zipfile
          from pathlib import Path
          root = Path('native/app/src/main/assets/quest-runtime')
          with zipfile.ZipFile('quest-compat/android/legacy-driver/build/outputs/apk/debug/legacy-driver-debug.apk') as apk:
              for abi in ['arm64-v8a', 'armeabi-v7a']:
                  for name in ['libvrapi.so', 'libopenxr_loader.so']:
                      path = root / abi / name
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(apk.read(f'lib/{abi}/{name}'))
          PYCODE
      - name: Bundle own driver installer
        run: |
          mkdir -p native/app/src/main/assets/runtime
          cp quest-compat/android/legacy-driver/build/outputs/apk/debug/legacy-driver-debug.apk native/app/src/main/assets/runtime/vrapi-driver.apk
      - name: Build NEXA launcher
        working-directory: native
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleAndroidTest
      - name: Package verified native libraries
        run: python3 quest-compat/tools/package-native-kit.py
      - name: Verify APK adaptation and signing on a synthetic fixture
        run: |
          mkdir -p /tmp/nexa-android-tools/lib /tmp/nexa-android-tools/lib64
          curl --fail --location --retry 3 -o /tmp/nexa-android-tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  /tmp/nexa-android-tools/apktool.jar' | sha256sum -c -
          cat > /tmp/nexa-android-tools/apktool <<'SH'
          #!/bin/sh
          exec java -jar "$(dirname "$0")/apktool.jar" "$@"
          SH
          chmod +x /tmp/nexa-android-tools/apktool
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          cp "$SDK_TOOLS/apksigner" "$SDK_TOOLS/zipalign" "$SDK_TOOLS/aapt2" /tmp/nexa-android-tools/
          cp "$SDK_TOOLS/lib/apksigner.jar" /tmp/nexa-android-tools/lib/
          cp "$SDK_TOOLS/lib64/libc++.so" /tmp/nexa-android-tools/lib64/
          export PATH="/tmp/nexa-android-tools:$PATH"
          python3 quest-compat/tools/smoke-adaptation.py
          tar -C /tmp -czf /tmp/nexa-android-tools.tgz nexa-android-tools
      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-Java-import-tests
          path: |
            /tmp/nexa-java-import-tests.zip
            /tmp/nexa-import-apksig.jar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-Android-adaptation-tools
          path: /tmp/nexa-android-tools.tgz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-Quest-Bridge-v4.2.1
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-Android-import-test-apks
          path: |
            native/app/build/outputs/apk/debug/app-debug.apk
            native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
  device-import-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NEXA-Android-import-test-apks
          path: apks
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify AndroidKeyStore signing and APK parsing on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb install $(find apks -name app-debug.apk)
            adb install $(find apks -name app-debug-androidTest.apk)
            adb shell appops set com.nexa.xr.debug SYSTEM_ALERT_WINDOW allow
            adb shell am instrument -w com.nexa.xr.debug.test/androidx.test.runner.AndroidJUnitRunner | tee device-test.log
            grep -q 'OK (10 tests)' device-test.log
            adb shell am start -W -n com.nexa.xr.debug/com.nexa.xr.HomeActivity
            adb shell screencap -p /sdcard/nexa-home.png
            adb pull /sdcard/nexa-home.png nexa-home.png
            adb shell am start -W -n com.nexa.xr.debug/com.nexa.xr.RuntimeProbeActivity
            for attempt in $(seq 1 30); do adb shell run-as com.nexa.xr.debug cat files/runtime-last.txt > runtime-probe.txt 2>/dev/null || true; if grep -q 'Descobrir extensões do runtime' runtime-probe.txt; then break; fi; sleep 1; done
            grep -q 'Descobrir extensões do runtime' runtime-probe.txt
            adb shell run-as com.nexa.xr.debug cat files/runtime-logs.txt > runtime-logs.txt
            grep -q 'Logs apenas do processo do teste' runtime-logs.txt
            adb logcat -d -b crash > crash-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEXA-device-test-api-${{ matrix.api }}
          path: |
            device-test.log
            nexa-home.png
            crash-log.txt
            runtime-probe.txt
            runtime-logs.txt
