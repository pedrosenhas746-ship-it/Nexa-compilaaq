name: NEXA ARM32 CPU experiment
on:
  push:
    branches: [quest-native-bridge-v3]
    paths: ['arm32-lab/**', '.github/workflows/arm32-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Pinned ARM emulator source
        run: |
          git clone https://github.com/unicorn-engine/unicorn.git /tmp/unicorn
          git -C /tmp/unicorn checkout 8028ec436f2d9376525352dd38ed9ed6b9f6be10
          cp /tmp/unicorn/COPYING arm32-lab/LICENSE
          mkdir -p arm32-lab/app/src/main/assets
          cp /tmp/unicorn/COPYING arm32-lab/app/src/main/assets/UNICORN-COPYING.txt
          python3 arm32-lab/tools/fixture.py arm32-lab/app/src/main/assets
      - name: Android toolchain
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'"
      - name: Build prototype and device tests
        working-directory: arm32-lab
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleAndroidTest -PunicornRoot=/tmp/unicorn
      - uses: actions/upload-artifact@v4
        with:
          name: NEXA-ARM32-Lab-0.1
          path: |
            arm32-lab/app/build/outputs/apk/debug/app-debug.apk
            arm32-lab/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: {name: NEXA-ARM32-Lab-0.1, path: apks}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb install $(find apks -name app-debug.apk)
            adb install $(find apks -name app-debug-androidTest.apk)
            adb shell am instrument -w com.nexa.arm32.lab.test/androidx.test.runner.AndroidJUnitRunner | tee device-test.log
            grep -q 'OK (6 tests)' device-test.log
            adb shell am start -W -n com.nexa.arm32.lab/com.nexa.arm32.LabActivity
            adb shell screencap -p /sdcard/arm32-lab.png
            adb pull /sdcard/arm32-lab.png arm32-lab.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: NEXA-ARM32-device-test, path: 'device-test.log'}
