name: Reality Engine iOS v0.6

on:
  push:
    branches:
      - reality-engine-ios-v06
    paths:
      - 'RealityEngineV06/**'
      - 'source_parts/**'
      - '.github/workflows/reality-engine-ios-v06.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p BuildSource
          cat source_parts/p-* > "$RUNNER_TEMP/a.b64"
          python3 -c "import base64,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP']); s=(p/'a.b64').read_bytes().strip(); s+=b'='*((4-len(s)%4)%4); (p/'a.tar.gz').write_bytes(base64.b64decode(s))"
          if gzip -t "$RUNNER_TEMP/a.tar.gz"; then
            cp "$RUNNER_TEMP/a.tar.gz" "$RUNNER_TEMP/reality.tar.gz"
          else
            cat RealityEngineV06/source.part* > "$RUNNER_TEMP/b.b64"
            python3 -c "import base64,pathlib,os; p=pathlib.Path(os.environ['RUNNER_TEMP']); s=(p/'b.b64').read_bytes().strip(); s+=b'='*((4-len(s)%4)%4); (p/'b.tar.gz').write_bytes(base64.b64decode(s))"
            gzip -t "$RUNNER_TEMP/b.tar.gz"
            cp "$RUNNER_TEMP/b.tar.gz" "$RUNNER_TEMP/reality.tar.gz"
          fi
          tar xzf "$RUNNER_TEMP/reality.tar.gz" -C BuildSource
          find BuildSource -maxdepth 3 -type f | head -80
          test -n "$(find BuildSource -name '*.xcodeproj' -type d | head -1)"

      - name: Xcode info
        run: |
          xcodebuild -version
          xcrun metal -v || true

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT=$(find BuildSource -name 'RealityEngineIOS.xcodeproj' -type d | head -1)
          xcodebuild -project "$PROJECT" -scheme RealityEngineIOS -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/RealityDerived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee device-build.log

      - name: Add 4K PBR surface pack
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/RealityDerived/Build/Products" -name 'RealityEngineIOS.app' -type d | head -1)
          test -n "$APP"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/asphalt_01/asphalt_01_diff_4k.jpg' -o "$APP/ph_asphalt_diff_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/asphalt_01/asphalt_01_nor_gl_4k.jpg' -o "$APP/ph_asphalt_nor_gl_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/asphalt_01/asphalt_01_rough_4k.jpg' -o "$APP/ph_asphalt_rough_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/concrete/concrete_diff_4k.jpg' -o "$APP/ph_concrete_diff_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/concrete/concrete_nor_gl_4k.jpg' -o "$APP/ph_concrete_nor_gl_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/concrete/concrete_rough_4k.jpg' -o "$APP/ph_concrete_rough_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/sand_03/sand_03_diff_4k.jpg' -o "$APP/ph_sand_diff_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/sand_03/sand_03_nor_gl_4k.jpg' -o "$APP/ph_sand_nor_gl_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/sand_03/sand_03_rough_4k.jpg' -o "$APP/ph_sand_rough_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/sparse_grass/sparse_grass_diff_4k.jpg' -o "$APP/ph_grass_diff_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/sparse_grass/sparse_grass_nor_gl_4k.jpg' -o "$APP/ph_grass_nor_gl_4k.jpg"
          curl -fL --retry 3 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/sparse_grass/sparse_grass_rough_4k.jpg' -o "$APP/ph_grass_rough_4k.jpg"
          echo 'Poly Haven CC0 PBR pack' > "$APP/PBR_LICENSE.txt"
          du -sh "$APP"

      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/RealityDerived/Build/Products" -name 'RealityEngineIOS.app' -type d | head -1)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload RealityEngineIOS-v0.6-PBR4K-unsigned.ipa
          ls -lh RealityEngineIOS-v0.6-PBR4K-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealityEngineIOS-v0.6-PBR4K
          compression-level: 0
          if-no-files-found: error
          path: |
            RealityEngineIOS-v0.6-PBR4K-unsigned.ipa
            device-build.log
