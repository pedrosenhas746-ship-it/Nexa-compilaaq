plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexa.questcraft'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexa.questcraft'
        minSdk 29
        targetSdk 35
        versionCode 141
        versionName '1.4.1-native-lodge'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation files('libs/Pojlib-release.aar')

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'org.jetbrains:annotations:24.0.1'
    implementation 'com.google.guava:guava:31.0.1-android'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'org.json:json:20220924'
    implementation 'commons-io:commons-io:2.13.0'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.microsoft.azure:msal4j:1.17.2'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'

    implementation 'com.google.ar:core:1.45.0'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Native Android renderer for the original QuestCraft launch lodge.
    implementation 'com.google.android.filament:filament-android:1.75.1'
    implementation 'com.google.android.filament:gltfio-android:1.75.1'
}
