plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexa.xr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexa.xr'
        minSdk 24
        targetSdk 35
        versionCode 230200
        versionName '23.2.0-universal-v2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
