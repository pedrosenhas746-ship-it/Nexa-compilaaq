plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexa.xr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexa.xr'
        minSdk 24
        targetSdk 35
        versionCode 230300
        versionName '23.3.0-vrapi'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

