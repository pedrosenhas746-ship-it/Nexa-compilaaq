plugins { id 'com.android.application' }
android {
    namespace 'com.nexa.arm32'
    compileSdk 35
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.nexa.arm32.lab'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-cpu-prototype'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', '-DUNICORN_ROOT='+project.findProperty('unicornRoot'); cppFlags '-std=c++17' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { minifyEnabled false } }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
